name: Docker Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t website .

      - name: Stop Existing Container
        run: |
          docker stop website || true
          docker rm website || true

      - name: Run Docker Container
        run: |
          docker run -d \
            --name website \
            -p 80:80 \
            website

      - name: Verify
        run: docker ps
